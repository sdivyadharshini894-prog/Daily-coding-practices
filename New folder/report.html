<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Road Damage</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#1e3c72;
    color:white;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:650px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#1e3c72;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:25px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.back{
    background:#6c757d;
}

.back:hover{
    background:#555;
}

img{
    width:100%;
    height:250px;
    object-fit:cover;
    margin-top:15px;
    border-radius:8px;
    display:none;
    border:2px solid #ddd;
}

</style>

</head>

<body>

<header>
🚧 AI Powered Road Damage Reporting System
</header>

<div class="container">

<h2>Report Road Damage</h2>

<form id="reportForm">

<label>Upload Road Damage Image</label>

<input
type="file"
id="image"
accept="image/*"
required>

<img id="preview">

<label>Location</label>

<input
type="text"
id="location"
placeholder="Enter Location"
required>

<label>Damage Type</label>

<select id="damageType" required>

<option value="">Select Damage Type</option>

<option>Pothole</option>

<option>Crack</option>

<option>Road Break</option>

<option>Water Logging</option>

<option>Other</option>

</select>

<label>Description</label>

<textarea
id="description"
rows="5"
placeholder="Describe the road damage..."
required></textarea>

<button type="submit">
Submit Report
</button>

<button
type="button"
class="back"
onclick="window.location.href='dashboard.html'">
Back to Dashboard
</button>

</form>

</div>

<script>

let image=document.getElementById("image");

image.onchange=function(){

const file=image.files[0];

if(file){

document.getElementById("preview").style.display="block";

document.getElementById("preview").src=URL.createObjectURL(file);

}

}

document.getElementById("reportForm").addEventListener("submit",function(e){

e.preventDefault();

alert("Road Damage Report Submitted Successfully!");

window.location.href="ai-result.html";

});

</script>

</body>
</html>
