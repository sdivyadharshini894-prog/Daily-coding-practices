<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#1e3c72;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card h2{
    color:#1e3c72;
    font-size:18px;
    margin-bottom:10px;
}

.card h1{
    color:#2563eb;
    font-size:36px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f2f2f2;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.logout{
    text-align:center;
    margin-top:25px;
}

.logout button{
    background:red;
    padding:12px 25px;
}

.logout button:hover{
    background:darkred;
}

</style>

</head>

<body>

<header>
🛠️ Admin Dashboard
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>Total Users</h2>
<h1>120</h1>
</div>

<div class="card">
<h2>Total Reports</h2>
<h1>58</h1>
</div>

<div class="card">
<h2>Pending Reports</h2>
<h1>14</h1>
</div>

<div class="card">
<h2>Completed Reports</h2>
<h1>44</h1>
</div>

</div>

<table>

<tr>
<th>Report ID</th>
<th>User</th>
<th>Location</th>
<th>Damage</th>
<th>Status</th>
<th>Action</th>
</tr>

<tr>
<td>RD001</td>
<td>Dhanusri</td>
<td>Karur</td>
<td>Pothole</td>
<td>Pending</td>
<td>
<button onclick="window.location.href='admin-status.html'">
Update
</button>
</td>
</tr>

<tr>
<td>RD002</td>
<td>Rahul</td>
<td>Salem</td>
<td>Crack</td>
<td>In Progress</td>
<td>
<button onclick="window.location.href='admin-status.html'">
Update
</button>
</td>
</tr>

<tr>
<td>RD003</td>
<td>Priya</td>
<td>Coimbatore</td>
<td>Road Break</td>
<td>Completed</td>
<td>
<button onclick="window.location.href='admin-status.html'">
Update
</button>
</td>
</tr>

</table>

<div class="logout">

<button onclick="logout()">
Logout
</button>

</div>

</div>

<script>

function logout(){

alert("Admin Logged Out Successfully");

window.location.href="login.html";

}

</script>

</body>
</html>
