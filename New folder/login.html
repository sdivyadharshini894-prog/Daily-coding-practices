<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Powered Road Damage Reporting System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
}

.container{
    width:380px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:#1e3c72;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:gray;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>🚧 AI Road Damage Reporting</h1>

<p>Login to your account</p>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Enter your Email"
required>

<input
type="password"
id="password"
placeholder="Enter your Password"
required>

<button type="submit">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">Register</a>
</div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(event){

    event.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(email.trim() === "" || password.trim() === ""){
        alert("Please enter both email and password.");
        return;
    }

    alert("Login Successful!");

    // Redirect to Dashboard
    window.location.href = "dashboard.html";

});

</script>

</body>
</html>
