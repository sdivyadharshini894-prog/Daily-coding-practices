<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Damage Map</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#1e3c72;
    color:white;
    text-align:center;
    padding:18px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}

.info{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    margin-bottom:20px;
}

.info h2{
    color:#1e3c72;
    margin-bottom:10px;
}

.info p{
    font-size:17px;
    color:#555;
}

.map{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

iframe{
    width:100%;
    height:500px;
    border:none;
    border-radius:10px;
}

.button-container{
    text-align:center;
    margin-top:25px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 25px;
    margin:10px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<header>
🗺️ Road Damage Location Map
</header>

<div class="container">

<div class="info">

<h2>Reported Locations</h2>

<p>
This map displays the locations of reported road damages.
In the final project, markers will automatically appear based on reports submitted by users.
</p>

</div>

<div class="map">

<iframe
src="https://www.google.com/maps?q=Karur,Tamil%20Nadu&output=embed">
</iframe>

</div>

<div class="button-container">

<button onclick="window.location.href='dashboard.html'">
🏠 Dashboard
</button>

<button onclick="window.location.href='my-reports.html'">
📋 My Reports
</button>

</div>

</div>

<script>

alert("Map Loaded Successfully");

</script>

</body>
</html>
